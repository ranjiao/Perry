name: merge-check

# Why this is a second workflow rather than another job in ci.yml.
#
# ci.yml answers "is this pull request green?" and it already checks out the
# MERGE RESULT — `actions/checkout` resolves `refs/pull/N/merge` on a
# `pull_request` event, which the run for PR #16 on 2026-08-20 shows verbatim:
#
#     git fetch ... +9e18354...:refs/remotes/pull/16/merge
#     HEAD is now at 9e18354 Merge 96822a4e... into e9d8c4dc...
#
# So "check out the merge result" is not the missing piece; it is what already
# happens. What ci.yml cannot answer is "is the tree we are about to HAVE
# green?", for two reasons this workflow exists to cover:
#
#   1. That merge result is computed against the base as it stood when the
#      event fired, and GitHub never re-fires `pull_request` when the base
#      branch moves underneath an open PR. PR #14 and PR #15 were both
#      computed against e9d8c4dc; #14 landed on 02e61fd and #15 landed on top
#      of #14, so no run ever saw the tree that shipped.
#   2. Nothing ever tests two OPEN changes together. #14 added both store
#      files to `claims[]`; #15 shipped tests asserting the world before that
#      claim. Each was fine alone. Merged, two tests were red that neither
#      change could have seen.
#
# Hence the trigger list below. `push` to an integration branch is exactly the
# moment a base moves under the PRs still queued against it, and that is when
# every one of them is re-checked.

on:
  pull_request:
    branches: [main, feat/work-modes]
  push:
    branches: [main, feat/work-modes]
  workflow_dispatch:

concurrency:
  group: merge-check-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pairs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Which branch are the open PRs queued against
        id: base
        run: |
          echo "ref=${{ github.event.pull_request.base.ref || github.ref_name }}" \
            >> "$GITHUB_OUTPUT"

      # The DEFAULT ref, deliberately — which on a pull_request is that PR's
      # merge result. Two reasons. It is the only tree guaranteed to contain
      # tests/merge-check (checking out the base cannot run a checker the base
      # does not have yet, which is how this workflow failed on the very PR
      # that added it). And it matches what GitHub already does with the
      # workflow file itself on a pull_request event, so the script and the
      # yaml driving it come from the same place.
      #
      # This checkout is only the source of the SCRIPT. Every tree the suite
      # actually runs on is built by tests/merge-check in its own clone, from
      # the base sha and the PR heads fetched below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # One authenticated fetch of every PR head and of the base branch.
      # tests/merge-check clones this checkout with --shared, so it reaches
      # these commits without credentials of its own.
      #
      # The destination is refs/remotes/pull/*/head, NOT refs/remotes/pull/*:
      # actions/checkout has already written refs/remotes/pull/<n>/merge for
      # this PR, so refs/remotes/pull/<n> is a directory and cannot also be a
      # ref. --force does not help with a D/F collision; a sibling name does.
      - name: Fetch every pull request head and the base branch
        run: |
          git fetch --no-tags --force origin \
            '+refs/pull/*/head:refs/remotes/pull/*/head' \
            "+refs/heads/${{ steps.base.outputs.ref }}:refs/remotes/origin/${{ steps.base.outputs.ref }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Stdlib only, like the rest of Perry. `gh` is preinstalled on the runner
      # and only used to list open PRs.
      - name: Every open PR merged together, against the current base tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tests/merge-check \
            --base "${{ steps.base.outputs.ref }}" \
            --all-open -j 4
