name: merge-check

# Construct and test one exact integration candidate independently of the author's
# checkout. Moving bases or combining several branches requires a fresh explicit
# run with the real base and every candidate; this is not an all-open-PR claim.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Immutable base commit already available in repository history
        required: true
      candidate:
        description: Immutable candidate commit already available in repository history
        required: true

permissions:
  contents: read
concurrency:
  group: merge-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test exact combined source with the new full suite
        env:
          BASE_SHA: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before }}
          CANDIDATE_SHA: ${{ inputs.candidate || github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 tests/merge-check --base "$BASE_SHA" --candidate "$CANDIDATE_SHA" \
            --tier full --record "$RUNNER_TEMP/perry-integration"
      - name: Retain integration receipt and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ github.run_id }}
          path: ${{ runner.temp }}/perry-integration
          if-no-files-found: error
