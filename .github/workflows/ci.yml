name: tests

# This job already tests the MERGE RESULT: `actions/checkout` resolves
# `refs/pull/N/merge` on a `pull_request` event, not the branch head. What it
# cannot see is a base that moves after the run, or a second PR open at the
# same time — that is `merge-check.yml`, which explains both in full.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No dependencies to install — Perry's scripts and tests are stdlib only,
      # with no exception since TASK-178 deleted the web viewer (its Flask,
      # markdown and jinja2 were the only non-stdlib packages Perry ever named).
      - name: Run the suite
        run: bash tests/run
