name: tests

# PR events test their merge result. The separate offline integration workflow
# retains an exact base/candidate receipt; changed bases need a fresh run.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check product release record against event base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 release/manage.py check --base "$BASE_SHA" --ref HEAD
      # New native kernel and retained helper acceptance suite; stdlib only.
      - name: Run the suite
        run: env -u PYTHONPATH -u PERRY_PROJECT -u PERRY_HOME -u PERRY_STORE bash tests/run --tier full
