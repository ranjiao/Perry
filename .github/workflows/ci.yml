name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No dependencies to install — Perry's scripts and tests are stdlib only.
      # The viewer's Flask requirement is opt-in and not exercised here.
      - name: Run the suite
        run: bash tests/run
