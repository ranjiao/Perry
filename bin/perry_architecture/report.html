<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perry · 代码结构</title><style>/* STYLES */</style></head>
<body><header><div class="brand">P<span>↗</span></div><div><strong id="title">代码结构</strong><small id="snapshot"></small></div><div class="header-actions"><span class="badge">PYTHON / STATIC</span><button id="coverage">扫描范围与限制</button><button id="download">导出 JSON ↓</button></div></header>
<section id="stats" aria-label="扫描统计"></section>

<aside aria-label="详情与源码"><button id="close-details">关闭详情 ×</button><div id="details"></div></aside></main>
